[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ShadowContact"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "matplotlib", "opencv-python-headless"]
[project.scripts]
shadowcontact = "shadowcontact:main"
[tool.setuptools]
py-modules = ["shadowcontact"]
